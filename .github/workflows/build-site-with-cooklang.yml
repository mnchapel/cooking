# ============================================================
# GitHub Actions Workflow: Build and Publish Recipes Site
#
# Description:
# This workflow builds the static website of recipes from the files located in the
# `cooklang/` folder.
#
# Trigger Conditions:
# - On push to the `prod` branch
# - Only if files inside the `cooklang/` directory have changed
#
# Manual Trigger:
# - Can also be triggered manually via the GitHub Actions interface.
# ============================================================

name: Publish site with cooklang
on:
  push:
    branches: [ 'prod' ]
    paths: ['cooklang/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install CookCLI
        run: |
          ls ${{ github.workspace }}